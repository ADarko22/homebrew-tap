name: Update Formula

on:
  repository_dispatch:
    types: [ release-formula ]
  workflow_dispatch:
    inputs:
      formula_name:
        description: 'Formula name (e.g., jdkcerts)'
        required: true
      version:
        description: 'Version (e.g., v1.0.0)'
        required: true
      download_url:
        description: 'Download URL pattern (e.g., https://github.com/ADarko22/JDKCertsTool/releases/download/v2.1.0/JDKCertsTool-v2.1.0.jar)'
        required: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Formula
        uses: mislav/bump-homebrew-formula-action@v3
        with:
          formula-name: ${{ github.event.client_payload.formula_name || github.event.inputs.formula_name }}
          tag-name: ${{ github.event.client_payload.version || github.event.inputs.version }}
          download-url: ${{ github.event.client_payload.download_url || github.event.inputs.download_url }}
          homebrew-tap: ADarko22/homebrew-tap
          push-to: ADarko22/homebrew-tap
          base-branch: main
        env:
          COMMITTER_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
